<script>
    function convert() {
      var amount = document.getElementById('amount').value;
      var fromCurrency = document.getElementById('fromCurrency').value;
      var toCurrency = document.getElementById('toCurrency').value;
      
      fetch(`https://api.exchangerate-api.com/v4/latest/${fromCurrency}`)
        .then(response => response.json())
        .then(data => {
          var exchangeRate = data.rates[toCurrency];
          var result = amount * exchangeRate;
          document.getElementById('result').innerHTML = `${amount} ${fromCurrency} = ${result.toFixed(2)} ${toCurrency}`;
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('result').innerHTML = 'An error occurred while fetching exchange rates.';
        });
    }
</script>

<script>
    const apiKey = "36e347533e1f4bdebde623abb9449ff7";
    const fetchCurrencyData = () => {
        const url = `https://openexchangerates.org/api/latest.json?app_id=${apiKey}`;

        $.getJSON(url, function(data) {
            const currencyRates = data.rates;
            const tableBody = $('#currencyTableBody');
            tableBody.empty(); // Clear existing data

            // Populate the table with currency rates
            let rowNumber = 1;
            for (const currency in currencyRates) {
                const rate = currencyRates[currency];
                const row = `<tr>
                                <td>${rowNumber++}</td>
                                <td>${currency}</td>
                                <td>${rate}</td>
                                <td class="text-right"><button class="btn btn-primary">View Charts</button></td>
                            </tr>`;
                tableBody.append(row);
            }
        });
    };

    // Call the fetchCurrencyData function initially
    fetchCurrencyData();

    // Refresh the data every 10 seconds
    setInterval(fetchCurrencyData, 10000);
</script>
